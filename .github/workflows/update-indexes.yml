name: Update MIGs country indexes

on:
  push:
    paths:
      - 'data/short-term/**'
      - 'data/working-holiday/**'
      - 'scripts/update_indexes.py'
      - '.github/workflows/update-indexes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migs-country-indexes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-indexes:
    # Only update the branch that received the Pages CMS change.
    runs-on: ubuntu-latest
    steps:
      - name: Check out updated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate short-term and working-holiday indexes
        run: python3 scripts/update_indexes.py
      - name: Commit and push indexes only if updated
        shell: bash
        run: |
          if git diff --quiet -- data/short-term/index.json data/working-holiday/index.json; then
            echo 'Indexes already current; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/short-term/index.json data/working-holiday/index.json
          git commit -m 'Automatically update MIGs country indexes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
