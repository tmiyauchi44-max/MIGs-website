    pattern: ^[a-z0-9-]+$
  - name: subtitle
    label: 短い紹介文
    type: string
  - name: description
    label: 詳細な紹介文
    type: text
  - name: eligibility
    label: 参加条件
    type: text
  - name: price
    label: 料金
    type: text
  - name: photo
    label: 写真
    type: image
